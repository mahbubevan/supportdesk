name: supportdesk

# Shared config for every service that runs the Laravel image
x-laravel: &laravel
  image: supportdesk-laravel
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-supportdesk}
    DB_USERNAME: ${DB_USERNAME:-supportdesk}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    REDIS_CLIENT: phpredis
    REDIS_HOST: valkey
    REDIS_PORT: 6379
  volumes:
    - ./laravel:/var/www/html
  depends_on:
    - mysql
    - valkey

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./laravel/public:/var/www/html/public:ro
    depends_on:
      - laravel
      - node

  laravel:
    <<: *laravel
    build:
      context: ./laravel
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}

  worker:
    <<: *laravel
    pull_policy: never
    command: [ "php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=60", "--max-time=3600" ]
    stop_grace_period: 70s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-supportdesk}
      MYSQL_USER: ${DB_USERNAME:-supportdesk}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"

  valkey:
    image: valkey/valkey:8-alpine
    command: [ "valkey-server", "--appendonly", "yes" ]
    volumes:
      - valkey_data:/data

  python:
    build: ./python-service
    image: supportdesk-python
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    volumes:
      - ./python-service/app:/app/app
    ports:
      - "${PYTHON_PORT:-8001}:8000"

  node:
    build: ./node-service
    image: supportdesk-node
    environment:
      PORT: 3000
    ports:
      - "${NODE_PORT:-3000}:3000"

volumes:
  mysql_data:
  valkey_data:
